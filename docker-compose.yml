services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: relayai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: relayai
      POSTGRES_USER: relayai
      POSTGRES_PASSWORD: relayai
    ports:
      - "5434:5432"
    volumes:
      - relayai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayai -d relayai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  relayai_postgres_data: